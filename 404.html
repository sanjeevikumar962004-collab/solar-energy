<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Disconnected | Stackly Clean Energy</title>
    <!-- Tailwind CSS for rapid styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="validation.js" defer></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#111111',
                        secondary: '#f9f9f9',
                        accent: '#e5e7eb',
                    }
                }
            }
        }
    </script>
    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="font-sans text-gray-800 antialiased bg-white selection:bg-gray-300 selection:text-black min-h-screen flex items-center justify-center p-6">

    <!-- Main 404 Error Display -->
    <main class="max-w-2xl w-full text-center py-12">
        <div class="flex justify-center mb-8">
            <a href="index.html" class="inline-block transition-opacity hover:opacity-80">
                <img src="images/stackly-logo-dark.webp" alt="Stackly Clean Energy" class="h-10 w-auto object-contain">
            </a>
        </div>
        <!-- Solar Flare Graphic Badge -->
        <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-yellow-50 text-yellow-800 border border-yellow-200 text-xs font-bold uppercase tracking-wider mb-6">
            <i class="fa-solid fa-triangle-exclamation text-yellow-600"></i> Grid Telemetry Interruption
        </div>

        <!-- Massive Stylized Typography -->
        <div class="relative my-2 select-none">
            <h1 class="text-8xl sm:text-9xl md:text-[11rem] font-black tracking-tighter text-black opacity-90 leading-none">
                4<span class="text-transparent bg-clip-text bg-gradient-to-r from-yellow-500 via-amber-400 to-black">0</span>4
            </h1>
            <!-- Small solar icon hovering -->
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none">
                <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-white shadow-xl flex items-center justify-center text-3xl text-yellow-500 border border-gray-100">
                    <i class="fa-solid fa-solar-panel"></i>
                </div>
            </div>
        </div>

        <h2 class="text-2xl sm:text-4xl font-extrabold text-black tracking-tight mb-4 mt-6">
            Circuit Break: Page Disconnected from the Grid
        </h2>
        <p class="text-sm sm:text-base text-gray-600 max-w-lg mx-auto leading-relaxed">
            The inverter connection or URL you are trying to reach seems to have lost power, been relocated, or is undergoing scheduled firmware maintenance.
        </p>
    </main>
</body>
</html>
